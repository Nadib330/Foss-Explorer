# Gradle
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# R8 (release builds). Menu entries are resolved by resource name at runtime
# (Resources.getIdentifier in AdapterMenu / AdapterSettingsMenu), which the
# stricter AGP 9 defaults would strip or rename. Keep upstream's behaviour until
# a minified release build has been verified on a device.
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
