<!DOCTYPE html>
<!--
  Explorer: the page that is shown when a website cannot be loaded.
  Own code, GPL-3.0.

  It stands in for the error page of Android System WebView, which is Chromium's
  and looks like neither Explorer nor this phone. The shape follows the one Chrome
  shows (a picture, the heading, what happened, and a way to search for the site),
  drawn in Explorer's own colours, which follow the system's light or dark mode.
-->
<html lang="{{lang}}" dir="{{dir}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{title}}</title>
  <style>
    :root {
      --bg: #fbf8f6;
      --fg: #1c1b1a;
      --fg-soft: #45403d;
      --pill: #ece5e0;
      --pill-fg: #1c1b1a;
      --line: #d6cec8;
      --accent: #8a4f2d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141211;
        --fg: #e8e1dc;
        --fg-soft: #c0b8b2;
        --pill: #35302d;
        --pill-fg: #e8e1dc;
        --line: #403a36;
        --accent: #f0b48c;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Roboto", "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.45;
      -webkit-text-size-adjust: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 24px 32px;
    }
    main {
      width: 100%;
      max-width: 460px;
      margin: 0 auto;
      text-align: start;
    }
    .picture {
      display: block;
      width: 100%;
      max-width: 260px;
      height: auto;
      margin: 8px auto 28px;
    }
    h1 {
      font-size: 26px;
      line-height: 1.25;
      font-weight: 500;
      margin: 0 0 16px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 16px;
      color: var(--fg-soft);
      font-size: 16px;
    }
    p b, p strong { color: var(--fg); font-weight: 600; }
    .url {
      font-weight: 600;
      color: var(--fg);
      word-break: break-all;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0 8px;
      padding: 12px 22px 12px 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--pill);
      color: var(--pill-fg);
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      max-width: 100%;
    }
    .pill:active { filter: brightness(0.94); }
    .pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .pill svg { flex: 0 0 auto; }
    .code {
      margin-top: 26px;
      font-size: 12px;
      letter-spacing: 0.04em;
      color: var(--fg-soft);
      opacity: 0.8;
      text-transform: uppercase;
    }
    .detail { margin-top: 2px; font-size: 13px; color: var(--fg-soft); opacity: 0.9; }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: in 180ms ease-out both; }
      @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    }
  </style>
</head>
<body>
<main>
  <!-- A window with a broken connection: clouds and a red bolt, as Chrome's page has, drawn by hand. -->
  <svg class="picture" viewBox="0 0 260 190" role="img" aria-label="{{picture_alt}}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="var(--line)" stop-opacity="0.35"/>
        <stop offset="1" stop-color="var(--line)" stop-opacity="0.12"/>
      </linearGradient>
    </defs>
    <g fill="none" stroke="var(--line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
      <!-- the window -->
      <rect x="66" y="34" width="128" height="96" rx="12"/>
      <line x1="66" y1="58" x2="194" y2="58"/>
      <circle cx="80" cy="46" r="3" fill="var(--line)" stroke="none"/>
      <circle cx="92" cy="46" r="3" fill="var(--line)" stroke="none"/>
      <circle cx="104" cy="46" r="3" fill="var(--line)" stroke="none"/>
      <!-- clouds -->
      <path d="M30 118c-9 0-16-7-16-15s7-15 16-15c2-10 11-17 21-17 11 0 20 8 22 19 8 1 14 8 14 16 0 7-6 12-13 12z" fill="url(#glass)"/>
      <path d="M186 148c-10 0-18-8-18-17s8-17 18-17c2-11 12-19 24-19 13 0 23 9 25 21 9 1 16 9 16 18 0 8-7 14-15 14z" fill="url(#glass)"/>
    </g>
    <!-- the bolt: the page did not arrive -->
    <path d="M136 62l-22 34h16l-6 26 26-36h-17z" fill="#e8443a"/>
  </svg>

  <h1>{{heading}}</h1>
  <p>{{summary}}</p>
  <p><span class="url">{{shown_url}}</span></p>
  {{suggestion}}

  <div class="code">{{code}}</div>
  <div class="detail">{{detail}}</div>
</main>
</body>
</html>
